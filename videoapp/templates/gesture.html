{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AirWriting Gesture Calculation</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        /* ===== Layout Section ===== */

        .layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
        }

        /* ===== Left: Video ===== */

        .video-container {
            flex: 3;
        }

        .video-stream {
            width: 100%;
            height: 620px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ===== Right: Output Panel ===== */

        .output-panel {
            flex: 1;
            background: #18243b;
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            height: 620px;
            display: flex;
            flex-direction: column;
        }

        .output-panel h2 {
            margin-bottom: 25px;
            font-size: 22px;
        }

        .result-box {
            font-size: 20px;
            background: #141e30d1;
            padding: 15px;
            border-radius: 10px;
        }

        /* ===== Footer ===== */

        footer {
            background: #111;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #f90000;
        }

    </style>
</head>

<body>

<div class="main-content">

    <h1>Hand Gesture Calculation</h1>

    <div class="layout">

        <!-- LEFT SIDE (Camera) -->
        <div class="video-container">
           <img src="{% url 'gesture_video' %}" class="video-stream">
        </div>

        <!-- RIGHT SIDE (Output) -->
        <div class="output-panel">
            <h2>Result</h2>
            <div class="result-box">
                <span id="result">Waiting for input...</span>
            </div>
        </div>

    </div>

</div>
<script>
    function fetchResult() {
        fetch("/get_gesture_result/")
        .then(response => response.json())
        .then(data => {
            document.getElementById("result").innerText = data.result;
        });
    }

    // Fetch every 500ms
    setInterval(fetchResult, 500);
</script>

<footer>
    © 2026
</footer>

</body>
</html>
